  box.appendChild(grp ? h("div", { class: "gap" }) : h("div", { onclick: function () { openProfile(m.sender); }, style: "cursor:pointer" }, [av(p, 40)]));

function quick(box, id) {

}
function react(mid, em) {

  (mine ? sb.from("reactions").delete().eq("message_id", mid).eq("user_id", me).eq("emoji", em) : sb.from("reactions").insert({ message_id: mid, emoji: em })).then(function () { loadReacts([mid]); });
}
function loadReacts(ids) {

    ids.forEach(function (id) { reacts[id] = []; }); (r.data || []).forEach(function (x) { (reacts[x.message_id] = reacts[x.message_id] || []).push(x); }); ids.forEach(paintReacts);

function paintReacts(id) {

  (reacts[id] || []).forEach(function (x) { (g[x.emoji] = g[x.emoji] || []).push(x.user_id); });
  Object.keys(g).forEach(function (em) { var chip = h("button", { class: "chip" + (g[em].indexOf(me) > -1 ? " me" : ""), onclick: function () { react(id, em); } }); chip.appendChild(rich(em)); chip.appendChild(document.createTextNode(" " + g[em].length)); c.appendChild(chip); });
}
function setReply(m) {
  replyTo = m; var r = $("#rb"); if (!r) return; r.hidden = !m; r.innerHTML = "";
  if (m) { r.appendChild(h("span", { text: "Respondendo a " + (profs[m.sender] || {}).display_name + ": " + (m.content || "📎 imagem") })); r.appendChild(ab("✕", "Cancelar", function () { setReply(null); })); $("#ci").focus(); }
}
function onMsg(e) {
  if (e.eventType === "DELETE") { var d = document.getElementById("m" + e.old.id); if (d) d.remove(); return; }
  var m = e.new;
  if (e.eventType === "UPDATE") { cache[m.id] = m; var o = document.getElementById("m" + m.id); if (o) { o.replaceWith(msgEl(m, false)); loadReacts([m.id]); } return; }
  var k = m.recipient ? (m.sender === me ? m.recipient : m.sender) : "g", vis = !$("#p-chat").hidden && !document.hidden;
  if (k === key(cur) && vis) { addMsg(m); if (m.sender !== me) { seen(k); ping(isMention(m.content)); } return; }
  if (k === key(cur) && !$("#p-chat").hidden) addMsg(m);
  if (m.sender === me) return;
  unread[k] = (unread[k] || 0) + 1; badge();
  var men = isMention(m.content); ping(men);
  if (document.hidden && !muted && window.Notification && Notification.permission === "granted") { try { new Notification((profs[m.sender] || {}).display_name + (m.recipient ? "" : " em #geral"), { body: m.content || "📎 imagem" }); } catch (x) {} }
}
function typing(id) {

  $("#ty").textContent = (profs[id] || {}).display_name + " está digitando…"; clearTimeout(tyHide); tyHide = setTimeout(function () { var t = $("#ty"); if (t) t.textContent = ""; }, 3000);

function slash(raw) {
  var m = /^\/(\w+)\s*(.*)$/.exec(raw); if (!m) return raw;
  var c = m[1].toLowerCase(), a = m[2], n;

  if (c === "flip") return "🪙 **" + profs[me].display_name + "** jogou a moeda: **" + (Math.random() < .5 ? "cara" : "coroa") + "**";
  if (c === "me") return "*" + profs[me].display_name + " " + a + "*";
  if (c === "clear") { $("#msgs").innerHTML = ""; toast("Tela limpa (só para você)"); return null; }
  if (c === "help") { toast("/roll /flip /me /shrug /tableflip /clear · **negrito** *itálico* ~~riscado~~ ||spoiler|| `código`"); return null; }
  return raw;

function send(att) {

/* Ctrl+K: trocar de conversa */
document.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && me) {
    e.preventDefault(); tab("chat");
    var opts = [{ id: null, n: "# geral" }].concat(Object.keys(profs).filter(function (i) { return i !== me; }).map(function (i) { return { id: i, n: profs[i].display_name }; })), box = h("div", {});

/* ---------- perfil, upload e recorte ---------- */
function pickFile(cb) {
  var i = h("input", { type: "file", accept: "image/png,image/jpeg,image/gif,image/webp" });
  i.onchange = function () { var f = i.files[0]; if (!f) return; if (f.size > 6 * 1024 * 1024) { toast("Máximo 6 MB"); return; } cb(f); };
  i.click();
}
function upload(f, kind) {
  var ext = ((f.name || "x.png").split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "") || "png";
  var path = me + "/" + kind + "-" + Date.now() + "." + ext;
  return sb.storage.from("media").upload(path, f, { contentType: f.type }).then(function (r) {
    if (r.error) { toast("Falha no upload"); throw r.error; }
    return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
  });
}
function cropper(f, round, cb) {
  var W = round ? 240 : 320, H = round ? 240 : 107, c = { z: 1, x: 0, y: 0 };
  var url = URL.createObjectURL(f), img = h("img", { src: url, alt: "" });
  var box = h("div", { class: "cb" }, [img]); box.style.width = W + "px"; box.style.height = H + "px"; box.style.borderRadius = round ? "50%" : "14px";
  var z = h("input", { type: "range", min: "1", max: "4", step: "0.01", value: "1", "aria-label": "Zoom", oninput: function () { c.z = +z.value; crop(img, c); } });
  var sx, sy, drag = false;
  box.onpointerdown = function (e) { drag = true; sx = e.clientX; sy = e.clientY; box.setPointerCapture(e.pointerId); };
  box.onpointermove = function (e) { if (!drag) return; c.x += (e.clientX - sx) / W; c.y += (e.clientY - sy) / H; sx = e.clientX; sy = e.clientY; crop(img, c); };
  box.onpointerup = function () { drag = false; };
  modal(h("div", { class: "glass mb p", style: "text-align:center" }, [
    h("div", { class: "nm", text: "Arraste para posicionar e use o zoom" }), box, z,
    h("div", { class: "acts", style: "justify-content:center" }, [h("button", { class: "btn", text: "Cancelar", onclick: closeModal }),
      h("button", { class: "btn ok", text: "Salvar", onclick: function () { cb(c); } })])]));
}

function openProfile(id) {

  var box = h("div", { class: "glass mb" }, kids);

var Music = (function () {
