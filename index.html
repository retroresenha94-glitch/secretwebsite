<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUB Admin Panel’s</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#070914;--text:#f4f6ff;--muted:rgba(230,236,255,.62);--edge:rgba(255,255,255,.28);--soft:rgba(255,255,255,.09);--ac:#7cf0ff;--ac2:#b18cff;--ok:#8dffb8;--bad:#ff6b8a}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0);-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bl{position:absolute;border-radius:50%;filter:blur(70px);opacity:.7;animation:dr 22s ease-in-out infinite alternate}
.b1{width:52vmax;height:52vmax;background:#3a63ff;top:-18vmax;left:-14vmax}.b2{width:46vmax;height:46vmax;background:#b44cff;bottom:-16vmax;right:-12vmax;animation-delay:-7s}.b3{width:34vmax;height:34vmax;background:#00d4c8;top:38%;left:42%;opacity:.45;animation-delay:-13s}
@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.18)}}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.07));border:1px solid var(--soft);border-top-color:var(--edge);border-left-color:var(--edge);border-radius:24px;-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 50px rgba(0,0,0,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;cursor:pointer;font:inherit;font-weight:600;font-size:.93rem;color:var(--text);text-decoration:none;background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s}
.btn:active{transform:scale(.95)}.btn.ok{background:rgba(141,255,184,.3);border-color:var(--ok)}.btn.red{color:var(--bad)}.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
input,textarea,select{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--soft);border-radius:14px;color:var(--text);font:inherit;padding:13px 14px;outline:0}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,240,255,.18)}
select option{background:#10142a}
.orb{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0,rgba(255,255,255,.1) 28%,transparent 30%),linear-gradient(135deg,var(--ac),#3a63ff 60%,var(--ac2));box-shadow:inset 0 2px 6px rgba(255,255,255,.7),0 0 40px rgba(124,240,255,.45);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
h1{margin:0;font-size:clamp(1.8rem,7vw,2.6rem);font-weight:800;letter-spacing:-.03em;background:linear-gradient(120deg,#fff 10%,var(--ac) 55%,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.center{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;padding:32px 24px;text-align:center;display:grid;gap:12px}
.card p{margin:0;color:var(--muted)}.err{color:var(--bad)!important;min-height:1.3em}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0))}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:10px;flex-wrap:wrap}
.top h1{font-size:1.35rem;margin-right:auto}
.tab.on{background:linear-gradient(160deg,rgba(124,240,255,.5),rgba(177,140,255,.3))}
.pane{flex:1;min-height:0;overflow:auto}
.list{display:grid;gap:10px;padding-bottom:20px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px}
.row .i{flex:1;min-width:0}.nm{font-weight:600}.cd{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{padding:14px;display:grid;gap:8px;margin-bottom:14px}
.chat{display:grid;grid-template-columns:230px 1fr;gap:10px;height:100%}
.side{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.side h4{margin:8px 8px 4px;font-size:.72rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ch{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;border:0;background:none;color:var(--text);font:inherit;text-align:left;width:100%}
.ch:hover,.ch.on{background:rgba(255,255,255,.14)}
.main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mh{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--soft);display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.m{display:flex;gap:12px}.m .b{min-width:0}.m .who{font-weight:600;cursor:pointer}.m .t{font-size:.72rem;color:var(--muted);margin-left:8px;font-weight:400}.m .tx{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.emo{height:1.5em;vertical-align:middle}
.comp{display:flex;gap:8px;padding:10px;border-top:1px solid var(--soft);position:relative}
.pick{position:absolute;bottom:64px;left:10px;width:min(320px,90%);max-height:220px;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,40px);gap:6px;background:#12162e;border-radius:18px;z-index:5}
.pick img{width:36px;height:36px;object-fit:contain;cursor:pointer;border-radius:8px}
.av{border-radius:50%;overflow:hidden;position:relative;flex:none;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06101c}
.av img,.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn{position:relative;overflow:hidden;height:110px;border-radius:20px 20px 0 0;background:linear-gradient(120deg,#3a63ff,#b44cff)}
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,5,12,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mb{width:100%;max-width:400px;max-height:92vh;overflow:auto;padding:0 0 18px}
.pf{padding:0 18px;display:grid;gap:10px}.pf .av{margin-top:-42px;border:5px solid #161a33}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.cb{position:relative;overflow:hidden;margin:0 auto;background:#000;touch-action:none;cursor:grab}
.cb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transform-origin:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);opacity:0;z-index:30;padding:12px 22px;border-radius:999px;font-weight:600;background:rgba(20,28,40,.8);border:1px solid rgba(141,255,184,.5);color:var(--ok);transition:.28s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:16px}.bars b{width:3px;height:4px;border-radius:2px;background:var(--ac)}.play .bars b{animation:eq 1s infinite}.play .bars b:nth-child(2){animation-delay:-.3s}.play .bars b:nth-child(3){animation-delay:-.6s}@keyframes eq{50%{height:16px}}
#sb{display:none}
@media(max-width:720px){.chat{grid-template-columns:1fr}.side{position:fixed;z-index:10;left:12px;top:70px;bottom:12px;width:250px;background:#12162e}.side.hide{display:none}#sb{display:inline-flex}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="bg"><div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div></div>

<div class="center" id="login" hidden>
  <form class="glass card" id="lf">
    <div class="orb"></div><h1>RUB Admin Panel’s</h1><p>Entre com seu username e senha.</p>
    <input id="lu" placeholder="Username" autocapitalize="off" autocomplete="username" spellcheck="false">
    <input id="lp" type="password" placeholder="Senha" autocomplete="current-password">
    <p class="err" id="le"></p>
    <button class="btn" type="submit" id="lb">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <div class="glass top">
    <h1>RUB Admin Panel’s</h1>
    <button class="btn sm tab on" data-t="req">Requires</button>
    <button class="btn sm tab" data-t="chat">Chat</button>
    <button class="btn sm" id="mus"><span class="bars"><b></b><b></b><b></b><b></b></span>Lofi</button>
    <button class="btn sm" id="me"></button>
    <button class="btn sm red" id="out">Sair</button>
  </div>
  <div class="pane" id="p-req"></div>
  <div class="pane" id="p-chat" hidden style="overflow:hidden"></div>
</div>
<div id="modal" hidden></div>
<div class="toast" id="toast"></div>

<script>
var SB_URL = "https://fjkslljqiimwkdegzafu.supabase.co";
var SB_KEY = "sb_publishable_AcJoblDLoAvZiPhX6Cw-Yw_m1wCuO9I";
var sb = supabase.createClient(SB_URL, SB_KEY);
var me = null, uname = "", profs = {}, emojis = {}, cur = null, rt = null;
var $ = function (s) { return document.querySelector(s); };

function h(t, a, k) {
  var e = document.createElement(t);
  for (var x in a) { if (x === "class") e.className = a[x]; else if (x === "text") e.textContent = a[x]; else if (x.slice(0, 2) === "on") e.addEventListener(x.slice(2), a[x]); else e.setAttribute(x, a[x]); }
  (k || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}
var tt;
function toast(m) { var t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("show"); }, 1800); }
function copy(txt) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  var t = document.createElement("textarea"); t.value = txt; t.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); } catch (e) {} t.remove(); return Promise.resolve();
}
function crop(img, c) { c = c || { z: 1, x: 0, y: 0 }; img.style.transform = "translate(" + c.x * 100 + "%," + c.y * 100 + "%) scale(" + c.z + ")"; }
function av(p, s) {
  var d = h("div", { class: "av" }); d.style.width = d.style.height = s + "px"; d.style.fontSize = s * .42 + "px";
  if (p && p.avatar_url) { var i = h("img", { src: p.avatar_url, alt: "" }); crop(i, p.avatar_crop); d.appendChild(i); } else d.textContent = ((p && p.display_name) || "?")[0].toUpperCase();
  return d;
}
function banner(p) {
  var d = h("div", { class: "bn" });
  if (p && p.banner_url) { var i = h("img", { src: p.banner_url, alt: "" }); crop(i, p.banner_crop); d.appendChild(i); }
  return d;
}
function rich(txt) {
  var f = document.createDocumentFragment();
  String(txt).split(/(:[a-z0-9_]{2,24}:)/).forEach(function (s) {
    var m = /^:([a-z0-9_]{2,24}):$/.exec(s);
    if (m && emojis[m[1]]) f.appendChild(h("img", { class: "emo", src: emojis[m[1]], alt: s })); else f.appendChild(document.createTextNode(s));
  });
  return f;
}
function closeModal() { $("#modal").hidden = true; $("#modal").innerHTML = ""; }
function modal(content) {
  var m = $("#modal"); m.innerHTML = ""; m.className = "modal";
  m.appendChild(content); m.hidden = false;
  m.onclick = function (e) { if (e.target === m) closeModal(); };
}

/* ---------- login ---------- */
$("#lf").addEventListener("submit", function (e) {
  e.preventDefault(); Music.prime();
  var u = $("#lu").value.trim().toLowerCase(), p = $("#lp").value;
  $("#le").textContent = ""; $("#lb").disabled = true;
  sb.auth.signInWithPassword({ email: u + "@rub.admin", password: p }).then(function (r) {
    $("#lb").disabled = false;
    if (r.error) { $("#le").textContent = "Username ou senha incorretos."; $("#lp").value = ""; return; }
    enter(r.data.user, true);
  });
});
$("#out").onclick = function () { Music.stop(); if (rt) sb.removeChannel(rt); sb.auth.signOut().then(function () { location.reload(); }); };

function enter(u, fresh) {
  me = u.id;
  Promise.all([
    sb.from("accounts").select("username").eq("id", me).single(),
    sb.from("profiles").select("*"), sb.from("emojis").select("*")
  ]).then(function (r) {
    if (!r[0].data) { $("#login").hidden = false; $("#le").textContent = "Conta sem perfil. Rode o SQL de setup."; sb.auth.signOut(); return; }
    uname = r[0].data.username;
    (r[1].data || []).forEach(function (p) { profs[p.id] = p; });
    (r[2].data || []).forEach(function (x) { emojis[x.name] = x.url; });
    $("#login").hidden = true; $("#app").hidden = false;
    paintMe(); loadReq(); buildChat();
    if (fresh) Music.start();
    rt = sb.channel("live").on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, onMsg)
      .on("postgres_changes", { event: "*", schema: "public", table: "emojis" }, function () {
        sb.from("emojis").select("*").then(function (x) { emojis = {}; (x.data || []).forEach(function (e) { emojis[e.name] = e.url; }); }); }).subscribe();
  });
}
function paintMe() { var b = $("#me"); b.innerHTML = ""; b.appendChild(av(profs[me], 26)); b.appendChild(h("span", { text: profs[me].display_name })); }
$("#me").onclick = function () { openProfile(me); };

document.querySelectorAll(".tab").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".tab").forEach(function (x) { x.classList.toggle("on", x === b); });
    $("#p-req").hidden = b.dataset.t !== "req"; $("#p-chat").hidden = b.dataset.t !== "chat";
    if (b.dataset.t === "chat") loadMsgs();
  };
});

/* ---------- requires ---------- */
function loadReq() {
  sb.from("requires").select("*").order("id").then(function (r) {
    var p = $("#p-req"); p.innerHTML = "";
    var name = h("input", { placeholder: "Nome do require" }), code = h("textarea", { rows: "2", placeholder: "Código. Use {u} onde vai o username" });
    var kind = h("select", {}, [h("option", { value: "require", text: "Require / script (copiar)" }), h("option", { value: "link", text: "Link (abrir)" })]);
    var add = h("div", { class: "glass add" }, [h("div", { class: "nm", text: "Adicionar novo" }), name, code, kind,
      h("button", { class: "btn", text: "Adicionar", onclick: function () {
        if (!name.value.trim() || !code.value.trim()) return;
        sb.from("requires").insert({ name: name.value.trim(), code: code.value, kind: kind.value }).then(function (x) { if (x.error) toast("Erro ao salvar"); else { toast("Adicionado"); loadReq(); } });
      } })]);
    var list = h("div", { class: "list" });
    (r.data || []).forEach(function (q) {
      var txt = q.code.split("{u}").join(uname), isL = q.kind === "link";
      var act = isL ? h("a", { class: "btn", href: txt, target: "_blank", rel: "noopener noreferrer", text: "Abrir link" })
        : h("button", { class: "btn", text: "Copiar", onclick: function (e) { var b = e.currentTarget; copy(txt).then(function () { b.classList.add("ok"); b.textContent = "Copiado"; setTimeout(function () { b.classList.remove("ok"); b.textContent = "Copiar"; }, 1300); toast(q.name + " copiado"); }); } });
      list.appendChild(h("div", { class: "glass row" }, [h("div", { class: "i" }, [h("div", { class: "nm", text: q.name }), h("div", { class: "cd", text: txt })]), act,
        h("button", { class: "btn sm red", "aria-label": "Apagar", text: "×", onclick: function () { if (confirm("Apagar " + q.name + "?")) sb.from("requires").delete().eq("id", q.id).then(loadReq); } })]));
    });
    p.appendChild(add); p.appendChild(list);
  });
}

/* ---------- chat ---------- */
function buildChat() {
  var p = $("#p-chat"); p.innerHTML = "";
  var side = h("div", { class: "glass side hide", id: "side" });
  side.appendChild(h("h4", { text: "Canais" }));
  side.appendChild(chBtn(null, "# geral"));
  side.appendChild(h("h4", { text: "Admins" }));
  Object.keys(profs).forEach(function (id) { if (id !== me) side.appendChild(chBtn(id)); });
  var main = h("div", { class: "glass main" }, [
    h("div", { class: "mh", id: "mh" }),
    h("div", { class: "msgs", id: "msgs" }),
    h("div", { class: "comp" }, [
      h("button", { class: "btn sm", id: "sb", text: "☰", onclick: function () { side.classList.toggle("hide"); } }),
      h("button", { class: "btn sm", text: "😊", "aria-label": "Emojis", onclick: togglePick }),
      h("input", { id: "ci", placeholder: "Escreva uma mensagem", maxlength: "2000", autocomplete: "off", onkeydown: function (e) { if (e.key === "Enter") send(); } }),
      h("button", { class: "btn", text: "Enviar", onclick: send })])]);
  p.appendChild(h("div", { class: "chat" }, [side, main]));
  head();
}
function chBtn(id, label) {
  var b = h("button", { class: "ch" + (cur === id ? " on" : ""), "data-id": id || "" });
  if (id) { b.appendChild(av(profs[id], 30)); b.appendChild(h("span", { text: profs[id].display_name })); } else b.textContent = label;
  b.onclick = function () { cur = id; document.querySelectorAll(".ch").forEach(function (x) { x.classList.toggle("on", x === b); }); $("#side").classList.add("hide"); head(); loadMsgs(); };
  return b;
}
function head() { var m = $("#mh"); if (!m) return; m.innerHTML = ""; if (cur) { m.appendChild(av(profs[cur], 28)); m.appendChild(h("span", { text: profs[cur].display_name })); } else m.textContent = "# geral"; }
function loadMsgs() {
  var q = sb.from("messages").select("*").order("created_at", { ascending: false }).limit(80);
  q = cur ? q.or("and(sender.eq." + me + ",recipient.eq." + cur + "),and(sender.eq." + cur + ",recipient.eq." + me + ")") : q.is("recipient", null);
  q.then(function (r) { var b = $("#msgs"); b.innerHTML = ""; (r.data || []).reverse().forEach(addMsg); b.scrollTop = b.scrollHeight; });
}
function addMsg(m) {
  var p = profs[m.sender] || { display_name: "?" }, d = new Date(m.created_at);
  var who = h("span", { class: "who", text: p.display_name, onclick: function () { openProfile(m.sender); } });
  var mine = m.sender === me;
  var box = h("div", { class: "m" }, [h("div", { onclick: function () { openProfile(m.sender); }, style: "cursor:pointer" }, [av(p, 40)]),
    h("div", { class: "b" }, [h("div", {}, [who, h("span", { class: "t", text: d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) }),
      mine ? h("button", { class: "t", style: "background:none;border:0;color:var(--bad);cursor:pointer", text: "apagar", onclick: function () { sb.from("messages").delete().eq("id", m.id).then(function () { box.remove(); }); } }) : null]),
      (function () { var t = h("div", { class: "tx" }); t.appendChild(rich(m.content)); return t; })()])]);
  var b = $("#msgs"); b.appendChild(box); b.scrollTop = b.scrollHeight;
}
function onMsg(e) {
  var m = e.new;
  if (!$("#msgs")) return;
  var ok = cur ? (m.recipient && ((m.sender === me && m.recipient === cur) || (m.sender === cur && m.recipient === me))) : !m.recipient;
  if (ok) addMsg(m); else if (m.recipient === me) toast("Nova mensagem de " + profs[m.sender].display_name);
}
function send() {
  var i = $("#ci"), v = i.value.trim(); if (!v) return; i.value = "";
  sb.from("messages").insert({ content: v, recipient: cur }).then(function (r) { if (r.error) toast("Não enviou"); });
}
function togglePick() {
  var old = $("#pick"); if (old) { old.remove(); return; }
  var pk = h("div", { class: "pick", id: "pick" });
  Object.keys(emojis).forEach(function (n) { pk.appendChild(h("img", { src: emojis[n], title: ":" + n + ":", alt: n, onclick: function () { $("#ci").value += ":" + n + ":"; $("#ci").focus(); } })); });
  pk.appendChild(h("button", { class: "btn sm", text: "+", title: "Novo emoji", onclick: function () { pk.remove(); newEmoji(); } }));
  document.querySelector(".comp").appendChild(pk);
}
function newEmoji() {
  pickFile(function (f) {
    var n = prompt("Nome do emoji (letras minúsculas, números e _):", "");
    if (!n) return; n = n.toLowerCase().replace(/[^a-z0-9_]/g, "");
    upload(f, "emoji").then(function (url) {
      sb.from("emojis").insert({ name: n, url: url }).then(function (r) { if (r.error) toast("Nome inválido ou já existe"); else { emojis[n] = url; toast(":" + n + ": criado"); } });
    });
  });
}

/* ---------- perfil, upload e recorte ---------- */
function pickFile(cb) {
  var i = h("input", { type: "file", accept: "image/png,image/jpeg,image/gif,image/webp" });
  i.onchange = function () { var f = i.files[0]; if (!f) return; if (f.size > 6 * 1024 * 1024) { toast("Máximo 6 MB"); return; } cb(f); };
  i.click();
}
function upload(f, kind) {
  var ext = (f.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "");
  var path = me + "/" + kind + "-" + Date.now() + "." + ext;
  return sb.storage.from("media").upload(path, f, { contentType: f.type }).then(function (r) {
    if (r.error) { toast("Falha no upload"); throw r.error; }
    return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
  });
}
function cropper(f, round, cb) {
  var W = round ? 240 : 320, H = round ? 240 : 107, c = { z: 1, x: 0, y: 0 };
  var url = URL.createObjectURL(f), img = h("img", { src: url, alt: "" });

var Music = (function () {
